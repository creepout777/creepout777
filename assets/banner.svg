<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Yassine Aitaouicha, Cybersecurity Student and Backend Developer">
  <defs>
    <clipPath id="frame"><rect width="1280" height="300" rx="18"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e13"/>
      <stop offset="0.6" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0c1912"/>
    </linearGradient>
    <radialGradient id="glow" cx="1030" cy="150" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ea043" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2ea043" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.45" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.68" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#30363d"/>
    </pattern>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="300" fill="url(#bg)"/>
    <rect width="1280" height="300" fill="url(#dots)" opacity="0.55"/>
    <rect width="1280" height="300" fill="url(#glow)"/>

    <!-- network graph -->
    <g stroke="#3fb950" stroke-width="1.4" stroke-opacity="0.38" fill="none">
      <line x1="1030" y1="150" x2="880" y2="82"/>
      <line x1="1030" y1="150" x2="905" y2="226"/>
      <line x1="1030" y1="150" x2="1152" y2="70"/>
      <line x1="1030" y1="150" x2="1188" y2="182"/>
      <line x1="1030" y1="150" x2="1098" y2="252"/>
      <line x1="880" y1="82" x2="842" y2="158"/>
      <line x1="842" y1="158" x2="905" y2="226"/>
      <line x1="880" y1="82" x2="968" y2="36"/>
      <line x1="968" y1="36" x2="1152" y2="70"/>
      <line x1="1152" y1="70" x2="1236" y2="118"/>
      <line x1="1236" y1="118" x2="1188" y2="182"/>
      <line x1="1188" y1="182" x2="1098" y2="252"/>
      <line x1="1098" y1="252" x2="978" y2="272"/>
      <line x1="978" y1="272" x2="905" y2="226"/>
    </g>
    <g stroke="#3fb950" stroke-width="2" stroke-dasharray="6 10" fill="none" stroke-opacity="0.9">
      <line x1="1030" y1="150" x2="1188" y2="182">
        <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <line x1="880" y1="82" x2="1030" y2="150">
        <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
      </line>
    </g>
    <g fill="#0d1117" stroke="#3fb950" stroke-width="2">
      <circle cx="880" cy="82" r="7"/>
      <circle cx="905" cy="226" r="6"/>
      <circle cx="842" cy="158" r="5"/>
      <circle cx="968" cy="36" r="5"/>
      <circle cx="1152" cy="70" r="7"/>
      <circle cx="1236" cy="118" r="5"/>
      <circle cx="1188" cy="182" r="7"/>
      <circle cx="1098" cy="252" r="6"/>
      <circle cx="978" cy="272" r="5"/>
    </g>
    <circle cx="1188" cy="182" r="7" fill="#3fb950">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="82" r="7" fill="#3fb950">
      <animate attributeName="opacity" values="0.9;0.15;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- shield -->
    <circle cx="1030" cy="152" r="54" fill="#0d1117" stroke="#3fb950" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M1030 112 L1063 125 L1063 153 C1063 173 1049 187 1030 196 C1011 187 997 173 997 153 L997 125 Z"
          fill="#102417" stroke="#3fb950" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="1030" cy="146" r="7.5" fill="#3fb950"/>
    <path d="M1025.5 150 L1034.5 150 L1037 168 L1023 168 Z" fill="#3fb950"/>

    <!-- keep the text side clean -->
    <rect width="1280" height="300" fill="url(#fade)"/>

    <!-- text -->
    <text x="80" y="98" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="20" fill="#3fb950">$ whoami<tspan>_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
    <text x="77" y="168" font-family="'Segoe UI',Inter,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="62" font-weight="700" letter-spacing="-1" fill="#f0f6fc">Yassine Aitaouicha</text>
    <rect x="80" y="188" width="420" height="2" fill="url(#rule)"/>
    <text x="80" y="226" font-family="'Segoe UI',Inter,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#c9d1d9">Cybersecurity Student  ·  Backend Developer</text>
    <text x="80" y="262" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="15" fill="#6e7681">EIDIA · Euro-Mediterranean University of Fes</text>

    <rect x="0" y="297" width="1280" height="3" fill="url(#rule)"/>
  </g>
</svg>

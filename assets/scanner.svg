<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Terminal output of the Unix vulnerability scanner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e13"/>
      <stop offset="1" stop-color="#0c1912"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#30363d"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="720" rx="18" fill="url(#dots)" opacity="0.45"/>

  <!-- window -->
  <rect x="60" y="50" width="1160" height="620" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M60 64 a14 14 0 0 1 14 -14 h1132 a14 14 0 0 1 14 14 v42 h-1160 z" fill="#161b22"/>
  <line x1="60" y1="106" x2="1220" y2="106" stroke="#30363d" stroke-width="2"/>
  <circle cx="98" cy="78" r="8" fill="#ff5f57"/>
  <circle cx="126" cy="78" r="8" fill="#febc2e"/>
  <circle cx="154" cy="78" r="8" fill="#28c840"/>
  <text x="640" y="85" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="18" fill="#8b949e">scanner-de-vulnerabilitees-unix</text>

  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="25" xml:space="preserve">
    <text x="100" y="160"><tspan fill="#3fb950">root@lab</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~/scanner</tspan><tspan fill="#c9d1d9"># ./scanner.sh</tspan></text>
    <text x="100" y="204" fill="#3fb950">[+] Scan démarré à 20261029_0805</text>
    <text x="100" y="248" fill="#e3b341">[SUID / SGID] <tspan fill="#c9d1d9">Binaires à privilèges</tspan></text>
    <text x="100" y="286" fill="#8b949e">    /usr/bin/passwd  /usr/bin/sudo  /usr/bin/mount</text>
    <text x="100" y="330" fill="#e3b341">[SUDOERS] <tspan fill="#c9d1d9">Entrées dangereuses</tspan></text>
    <text x="100" y="368" fill="#f85149">    backup ALL=(ALL) NOPASSWD: /usr/bin/tar</text>
    <text x="100" y="412" fill="#e3b341">[PATH INJECTION] <tspan fill="#c9d1d9">Répertoires writable</tspan></text>
    <text x="100" y="450" fill="#f85149">    Writable : /opt/tools/bin</text>
    <text x="100" y="494" fill="#e3b341">[RED TEAM] <tspan fill="#c9d1d9">Artefacts suspects</tspan></text>
    <text x="100" y="538" fill="#e3b341">[SYSTEMD TIMERS] <tspan fill="#c9d1d9">Timers actifs</tspan></text>
    <text x="100" y="582" fill="#58a6ff">===== CHANGEMENTS DEPUIS LE DERNIER SCAN =====</text>
    <text x="100" y="626" fill="#3fb950">[+] Scan terminé <tspan fill="#8b949e">→ report/report.html</tspan><tspan fill="#3fb950"> _<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>
